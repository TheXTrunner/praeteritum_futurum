plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
    id 'com.modrinth.minotaur' version '2.+'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    maven {
        name = "CurseMaven"
        url = "https://cursemaven.com"
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // Enables Microsoft account login prompt on launch
            devLogin = true
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            gameDirectory = project.file('run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Add JEI for your dev/runtime environment
    localRuntime "curse.maven:jei-238222:8932766"
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// ======================
// CurseForge Publishing
// ======================
// Used by .github/workflows/build.yml for CurseForge uploads.
// The CURSEFORGE_API_KEY environment variable must be set (via GitHub Secrets in CI).
// Run with: ./gradlew curseforge

// Capture project properties at configuration time for configuration cache compatibility
def _cfJarFile = project.file('build/libs/' + project.name + '-' + project.version + '.jar')
def _cfVersion = project.version.toString()
def _cfName = project.name.toString()
def _cfChangelog = extractChangelogSection()

tasks.register('curseforge') {
    doLast {
        def apiToken = System.getenv('CURSEFORGE_API_KEY')
        if (!apiToken || apiToken.isEmpty()) {
            println 'WARNING: CURSEFORGE_API_KEY not set — skipping CurseForge upload'
            return
        }

        if (!_cfJarFile.exists()) {
            throw new GradleException('JAR file not found: ' + _cfJarFile.path)
        }

        // Use the CurseForge author upload API: /api/projects/{projectId}/upload-file
        // Base URL: authors.curseforge.com (not api.curseforge.com)
        // Authentication: X-Api-Token header (not X-API-Key)
        def url = new URL('https://authors.curseforge.com/api/projects/1774651/upload-file')
        def connection = url.openConnection()
        connection.doOutput = true
        connection.requestMethod = 'POST'
        connection.setRequestProperty('X-Api-Token', apiToken)

        def boundary = '----CurseForgeBoundary' + System.currentTimeMillis()
        connection.setRequestProperty('Content-Type', 'multipart/form-data; boundary=' + boundary)

        // Build metadata JSON with required fields
        def metadata = new groovy.json.JsonBuilder()
        metadata {
            changelog(_cfChangelog)
            changelogType('markdown')
            displayName("Praeteritum Futurum v${_cfVersion}")
            releaseType('beta')
        }
        def metadataJson = metadata.toString()

        // Build multipart request body
        def body = new ByteArrayOutputStream()

        // Part 1: metadata (JSON)
        body.write(('--' + boundary + '\r\n').getBytes('UTF-8'))
        body.write('Content-Disposition: form-data; name="metadata"\r\n'.getBytes('UTF-8'))
        body.write('Content-Type: application/json\r\n\r\n'.getBytes('UTF-8'))
        body.write(metadataJson.getBytes('UTF-8'))
        body.write('\r\n'.getBytes('UTF-8'))

        // Part 2: file (JAR)
        body.write(('--' + boundary + '\r\n').getBytes('UTF-8'))
        body.write(('Content-Disposition: form-data; name="file"; filename="' + _cfName + '-' + _cfVersion + '.jar"\r\n').getBytes('UTF-8'))
        body.write('Content-Type: application/java-archive\r\n\r\n'.getBytes('UTF-8'))
        body.write(_cfJarFile.bytes)
        body.write('\r\n'.getBytes('UTF-8'))

        // Closing boundary
        body.write(('--' + boundary + '--\r\n').getBytes('UTF-8'))

        connection.outputStream.write(body.toByteArray())
        connection.outputStream.flush()

        def responseCode = connection.responseCode
        if (responseCode != 200) {
            def response = connection.errorStream?.getText('UTF-8') ?: 'No response body'
            throw new GradleException('CurseForge upload failed with code ' + responseCode + ': ' + response)
        }

        println 'Successfully uploaded to CurseForge'
    }
}

// Extract the current version section from CHANGELOG.md for publish platforms
def extractChangelogSection() {
    def changelogFile = new File('CHANGELOG.md')
    def lines = changelogFile.readLines()
    def version = project.version.toString()
    def startLine = -1
    def endLine = -1

    for (int i = 0; i < lines.size(); i++) {
        def line = lines[i]
        // Match "## [0.1.3]" or "## [Unreleased]"
        if (line ==~ /## \[.*${version}.*\]/ || line ==~ /## \[Unreleased\]/) {
            startLine = i
        } else if (startLine >= 0 && line =~ /^## \[/ && i > startLine) {
            endLine = i
            break
        }
    }

    if (startLine >= 0) {
        if (endLine > startLine) {
            return lines.subList(startLine + 1, endLine).join('\n')
        } else {
            return lines.subList(startLine + 1, lines.size()).join('\n')
        }
    }
    // Fallback: return entire file
    return changelogFile.text
}

// ======================
// Modrinth Publishing
// ======================
// The MODRINTH_TOKEN environment variable must be set (via GitHub Secrets in CI).
// Run with: ./gradlew modrinth
def modrinthToken = System.getenv('MODRINTH_TOKEN')
if (modrinthToken && !modrinthToken.isEmpty()) {
    modrinth {
        // Your Modrinth access token — NEVER hardcode it. Use the environment variable from GitHub Secrets.
        token = modrinthToken

        // Your Modrinth project ID (the slug from your project URL)
        projectId = 'praeteritum-futurum'

        // Version number and name
        versionNumber = project.version
        versionName = "Praeteritum Futurum v${project.version}"
        versionType = 'beta'

        // Changelog — only the current version section, not the entire file
        changelog = extractChangelogSection()

        // Game versions and loaders
        gameVersions = [project.minecraft_version]
        loaders = ['neoforge']

        // Upload the built JAR
        uploadFile = project.file('build/libs/' + project.name + '-' + project.version + '.jar')

        // Sync the project body (description) from README.md on each publish
        // Requires MODRINTH_TOKEN with PROJECT_WRITE scope
        syncBodyFrom = new File('README.md').text
    }

    // Ensure the project body (description) syncs with Modrinth on every publish
    tasks.named('modrinth') {
        mustRunAfter 'modrinthSyncBody'
    }
    tasks.named('modrinthSyncBody') {
        // Sync body runs before modrinth upload
    }
} else {
    println 'WARNING: MODRINTH_TOKEN not set — Modrinth publishing disabled'
}
