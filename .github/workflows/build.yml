name: Build

on:
  push:
    branches: [main, dev]
    tags: ['*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    if: "!startsWith(github.ref, 'refs/tags/')"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    if: always() && startsWith(github.ref, 'refs/tags/') && needs.build.result == 'skipped'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

      - name: Extract changelog for GitHub Release
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          changelog_path = Path("CHANGELOG.md")
          if not changelog_path.is_file():
              raise SystemExit("CHANGELOG.md was not found; refusing to create a release without notes.")

          lines = changelog_path.read_text(encoding="utf-8").splitlines()
          heading_pattern = re.compile(r"^## \[([^\]]+)\](?:\s+-\s+.*)?\s*$")
          release_version = os.environ["RELEASE_VERSION"]
          section_start = None
          section_name = release_version

          for index, line in enumerate(lines):
              match = heading_pattern.fullmatch(line)
              if match and match.group(1) == release_version:
                  section_start = index
                  break

          if section_start is None:
              for index, line in enumerate(lines):
                  match = heading_pattern.fullmatch(line)
                  if match and match.group(1) == "Unreleased":
                      section_start = index
                      section_name = "Unreleased"
                      break

          if section_start is None:
              raise SystemExit(
                  f"No CHANGELOG.md section found for '{release_version}' or [Unreleased]; refusing to create a release."
              )

          section_end = next(
              (index for index in range(section_start + 1, len(lines)) if lines[index].startswith("## ")),
              len(lines),
          )
          release_body = "\n".join(lines[section_start + 1:section_end]).strip()
          if not release_body:
              raise SystemExit(
                  f"CHANGELOG.md section for '{section_name}' is empty; refusing to create a release."
              )

          Path("release_body.md").write_text(release_body + "\n", encoding="utf-8")
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Praeteritum Futurum v${{ github.ref_name }}"
          prerelease: true
          files: build/libs/praeteritum_futurum-${{ github.ref_name }}.jar
          body_path: release_body.md

      - name: Publish to CurseForge and Modrinth
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: ./gradlew publishMods