name: Build

on:
  push:
    branches: [main, dev]
    tags: ['*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

      - name: Extract changelog for release
        id: changelog
        run: |
          # Extract the section between the current version header and the next version header
          VERSION="${GITHUB_REF#refs/tags/}"
          CHANGELOG=$(sed -n "/^## \[${VERSION}\]/,/^## \[/p" CHANGELOG.md | sed '$d')
          # If exact version tag not found, try "Unreleased" section
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG=$(sed -n '/^## \[Unreleased\]/,/^## \[/p' CHANGELOG.md | sed '$d')
          fi
          # Write to a file for the release step
          echo "$CHANGELOG" > release_body.md
          # Also write to a temp file for CurseForge action
          mkdir -p .ci
          echo "$CHANGELOG" > .ci/changelog.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          body_path: release_body.md

      - name: Publish to CurseForge
        uses: itsmeow/curseforge-upload@v3
        with:
          token: ${{ secrets.CURSEFORGE_TOKEN }}
          project_id: 1774651
          game_endpoint: minecraft
          file_path: build/libs/*.jar
          game_versions: 1.21.1
          release_type: beta
          changelog_file: .ci/changelog.md
          changelog_type: markdown
          display_name: Praeteritum Futurum v${{ github.ref_name }}

      - name: Publish to Modrinth
        continue-on-error: true
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: ./gradlew modrinth