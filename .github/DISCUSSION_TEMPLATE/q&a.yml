title: "[QUESTION] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        ## Ask a Question
        Have a question about Praeteritum Futurum? Fill out the form below to help others understand and answer your question.

  - type: textarea
    id: question
    attributes:
      label: "Question"
      description: "What would you like to know?"
    validations:
      required: true

  - type: input
    id: minecraft-version
    attributes:
      label: "Minecraft Version"
      description: "What version of Minecraft are you using?"
      placeholder: "1.21.1"
    validations:
      required: true

  - type: input
    id: mod-version
    attributes:
      label: "Praeteritum Futurum Version"
      description: "What version of the mod are you running?"
      placeholder: "0.1.3"
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: "Additional Context"
      description: "Share screenshots, machine setups, or any other details that help explain your question"
    validations:
      required: false
