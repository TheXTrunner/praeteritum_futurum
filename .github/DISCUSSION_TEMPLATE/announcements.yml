title: "[ANNOUNCEMENT] "
labels: ["announcement"]
body:
  - type: markdown
    attributes:
      value: |
        ## Official Announcement
        Use this template for official updates about Praeteritum Futurum.

  - type: textarea
    id: whats-new
    attributes:
      label: What's New
      description: Brief summary of the announcement
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Details
      description: Expand on the announcement with more context, links, or screenshots
    validations:
      required: false

  - type: textarea
    id: whats-next
    attributes:
      label: What's Next
      description: Optional: mention upcoming plans or what users should do
    validations:
      required: false
